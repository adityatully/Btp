# PPO with set encoder (SPEC 11.4). Starting points only.
name: ppo
d_model: 128
n_layers: 3
n_heads: 4
num_envs: 32
rollout_steps: 128
gamma: 1.0
reward_scale: 1.0             # rewards x this before GAE; a positive constant leaves the optimal
                              # policy unchanged (gamma = 1) but keeps value targets near unit
                              # scale: under costs/geometric (sample 64) returns reach thousands
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: true              # clip the value loss like the policy ratio (CleanRL default)
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
lr: 3.0e-4
anneal_lr: true
update_epochs: 4
num_minibatches: 8
total_env_steps: 5_000_000
max_chunk_rows: 131072        # candidate rows per forward in an update (memory bound, not maths)
imitation_coef: 0.0           # imitation term weight at the start (0 = off); falls linearly to 0
imitation_steps: 1_000_000    # ... over this many env steps (SPEC 11.4, warm start)
imitation_batch: 64           # demonstration steps per minibatch
imitation_problems: 1000      # demonstration problems drawn from the training source first
