# PPO with set encoder (SPEC 11.4). Starting points only.
name: ppo
d_model: 128
n_layers: 3
n_heads: 4
num_envs: 32
rollout_steps: 128
gamma: 1.0
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: true              # clip the value loss like the policy ratio (CleanRL default)
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
lr: 3.0e-4
anneal_lr: true
update_epochs: 4
num_minibatches: 8
total_env_steps: 5_000_000
