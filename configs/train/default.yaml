device: auto                  # auto = cuda if available, else cpu; or cuda / mps / cpu (PPO)
gpu_memory_fraction: 0.5      # CUDA: most of the GPU's memory this run may take (shared machine)
vector: sync                  # PPO vector env: sync (one process) or async (one per env)
resume: null                  # PPO: path to a checkpoint (last.pt) to continue from
log_dir: tensorboard
use_wandb: false
checkpoint_every_updates: 50
eval_every_updates: 50
# Training instances from a frozen benchmark set. Tabular Q (M6) needs this: it keys on exact
# states, so it only learns about instances it will meet again. PPO trains one network on these
# instances (M8 acceptance (a)); training from a generator follows the stage design.
source: benchmark             # benchmark: train on these instances; generator: draw a fresh
                              # problem per episode from the `generator` config (PPO only), and
                              # use this benchmark only for evaluation; regime: draw from the
                              # `stages` design's cells as `regime` sets, validate on its sets
exclude: [tiny_exact_v1, val_stage1_v2]  # frozen sets a generator source never draws from
benchmark: tiny_exact_v1
instances: null               # null = every instance in the set; or a list of instance ids
per_instance: true            # tabular Q only: one table per instance (M6 acceptance)
log_every: 2000
