# Environment padding sizes and options (SPEC 9). Exceeding any limit raises an error naming the instance.
# The step limit belongs to each instance (set by the generator).
# F_max/T_max must cover the largest generator stage; tests/generators check this.
F_max: 4                      # max fluids per instance (mixture_*: 1 sample + 2 reagents + 1 buffer)
T_max: 12                     # max targets per instance (mixture_multi: 4 experiments x 3)
storage_capacity_max: 10      # S_max = F_max + storage_capacity_max
L_max: 2048                   # max legal candidate actions per step
preference_conditioning: false
