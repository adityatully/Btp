# Environment padding sizes and feature scales (SPEC 9.2). Padding sizes are memory settings,
# not limits of a trained network: raising one never invalidates weights. An instance larger
# than a padding size raises an error naming it. The step limit belongs to each instance.
# Sized for the input ranges of SPEC 1.3, probes included; a run may lower them.
F_pad: 10                     # fluid rows (training F <= 6, probes up to 10)
T_pad: 20                     # target rows (training T <= 10, probes up to 20)
N_pad: 32                     # droplet rows; must cover every chip's storage_capacity
                              # (training 2-16; 32 stands in for "unbounded")
L_pad: 16384                  # candidate rows (random play peaks near 9,300 at M = 10, F = 6, S = 32)
volume_ref: 16                # absolute volume scale: volume / volume_ref (a scale, not a cap)
count_ref: 16                 # absolute count scale: demand, steps left, storage capacity
preference_conditioning: false
failure_penalty_factor: 2     # truncation / dead-end penalty = this x the construction's cost to
                              # finish (SPEC 5.8); at 1, giving up out-earns any finished plan
                              # worse than ~1.1-1.3x the construction (pilot, 2026-10-23)
cost_to_finish: share         # the completion that prices an unfinished plan (SPEC 5.8): share =
                              # finish from here, reusing droplets on chip; construction = waste
                              # them and rebuild (gave no credit for intermediates, E-18)
