[project]
name = "meda"
version = "0.1.0"
description = "RL-based design automation for MEDA biochips (sample-preparation agent first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "gymnasium>=1.0",
    "torch",
    "hydra-core",
    "omegaconf",
    "tensorboard",
    "pandas",
    "pyarrow",
    "matplotlib",
    "networkx",
    "rich",
    "tqdm",
]

[project.optional-dependencies]
# Off by default (SPEC section 3).
tracking = ["wandb"]
sb3 = ["sb3-contrib"]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meda"]

# Training runs only on the Linux workstation (RTX A5000): take CUDA wheels there.
# On macOS the default PyPI wheel (CPU) is used for tests and development.
# cu130 needs NVIDIA driver >= 580 on the workstation; change the index if the driver is older.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow acceptance runs are skipped by default; run them with `uv run pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = ["slow: long acceptance runs (milestone acceptance criteria)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# `l` is SPEC notation for the second mix volume (k:l).
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Strict on the exact rules engine (SPEC section 18).
[[tool.mypy.overrides]]
module = "meda.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
